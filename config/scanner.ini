; =====================================================================
; NIFTY & SENSEX pre-breakout CE / PE scanner  (python -m src.main)
; ALERTS + PAPER TRADING by default. Real orders only with [EXECUTION] mode = live AND the daily arming
; step (python -m src.execution.live_gate --arm). Scores are setup-strength scores (heuristic), NOT probabilities.
; Every threshold below is a starting hypothesis to be validated
; (python -m src.backtest), not a proven value.
;
; Strategy / risk values are re-read within one cycle when you save this
; file; [SERVICE] indices and [DASHBOARD] changes need a restart.
; Secrets (Upstox, Telegram) do NOT belong here: put them in .env.
; =====================================================================

[SERVICE]
; live = Upstox data (REST + WebSocket); mock = synthetic data, no credentials
mode = live
; true = paper trading (ENTRY SETUPs open simulated positions); false = alert-only mode.
; Real orders are controlled separately by [EXECUTION] below (default: simulated).
paper_trading = true
; Supported: NIFTY, SENSEX (and nothing else - see src/config/instruments.py). Instrument keys, option
; names and F&O segments are defined there; expiries, lot sizes and strike steps come from the Upstox
; instrument master / option chain every day.
indices = NIFTY, SENSEX
; seconds between evaluation cycles during market hours (the signal timeframe is in [TIMEFRAME])
loop_seconds = 30
; Upstox REST rate limit shared by every call
requests_per_second = 5
; stream index / futures / VIX last prices over the Upstox WebSocket (REST quotes are always used too)
use_websocket = true
; manual event blocks (RBI policy, budget, ...): date,time,name,impact
events_file = config/events.csv
; create this file (empty) to block new entries and square off paper positions; delete it to resume
kill_switch_file = KILL_SWITCH

[DASHBOARD]
; built-in web dashboard, started inside the scanner process (no browser is opened for you)
enabled = true
host = 127.0.0.1
port = 8502

[DATA_QUALITY]
; anything older than this puts the index in NO TRADE and raises a "data stale" alert
max_spot_age_seconds = 120
max_chain_age_seconds = 180
max_candle_lag_minutes = 7
; option quotes wider than this are never selected
max_spread_pct = 3.0
max_spread_points = 3.0

[TIMEFRAME]
signal_minutes = 5
opening_range_minutes = 15
; no WATCH before / no new ENTRY after these times (IST)
watch_start = 09:30
last_entry = 14:45
square_off = 15:15

[INDICATORS]
ema_periods = 9, 20, 50, 200
rsi_length = 14
macd_fast = 12
macd_slow = 26
macd_signal = 9
adx_length = 14
atr_length = 14
bb_length = 20
bb_std = 2.0
volume_ma = 20
swing_left = 3
swing_right = 3

[LEVELS]
; levels within merge_atr x ATR(5m) are one zone
merge_atr = 0.30
; zones further than this (in ATR) are ignored for the watch
watch_max_atr = 1.5
; within this distance the location score is full
near_atr = 0.30
min_zone_strength = 3

[SCORING]
; family caps (sum = 100). Correlated indicators share one family cap so they are not counted twice.
w_location = 20
w_level = 10
w_compression = 15
w_structure = 15
w_trend = 15
w_momentum = 10
w_participation = 10
w_context = 5
rsi_ce_min = 52
rsi_ce_max = 70
rsi_pe_min = 30
rsi_pe_max = 48
adx_min = 18
rvol_good = 1.2
stretched_atr = 2.5

[THRESHOLDS]
; 0-49 none, 50-64 early watch, 65-79 high priority, 80-100 strong candidate
early_watch = 50
high_watch = 65
strong_watch = 80
; minimum score (pre-breakout bar or breakout bar) to accept a confirmation / an entry setup
confirm_min_score = 55
entry_min_score = 65
; Dominance: the trade side's score must lead the other side's (tested 18 Oct on NIFTY 2023-26: improved both
; halves of the history, PF 0.83 -> 0.99 and 1.02 -> 1.12). On by default.
watch_min_dominance = 15
entry_min_dominance = 20
; Optional stricter gates from the same test - OFF: they cut entries to 13 (or 3 with entry_min_score 80) in
; 3.8 years and those lost. 0 = off.
min_compression_pct = 0
watch_trigger_atr = 1.5
; bars of the signal timeframe needed before anything is evaluated (NO TRADE until then)
min_history_bars = 60

[SCORE_V2]
; second score (5-min context + 1-min confirmation, 7 components) run alongside on paper for comparison
enabled = true
; send its alerts to Telegram / popups too (false = dashboard and database only)
push = false

[ML]
; ML trade filter (src/scanner/ml_filter.py; train with python -m src.scanner.ml_filter --train). It always shows its win probability on entries; it may BLOCK an
; entry only when the trained model is marked approved (it beat the rules on unseen data).
enabled = true
model_file = data/prebreakout_ml_model.json
allow_block = true

[CONFIRMATION]
; close must be beyond the level by max(buffer_atr x ATR, buffer_pct % of price)
buffer_atr = 0.10
buffer_pct = 0.02
min_body_ratio = 0.45
; close in the outer part of the bar (0.6 = top 40% for CE, bottom 40% for PE)
min_close_position = 0.60
; relative futures volume on the breakout bar (ignored where no volume exists, and said so)
min_rvol = 1.0
require_vwap = true
require_trend = false
; an ENTRY SETUP needs a WATCH on that level before the break (Stage A -> B -> C)
require_prior_watch = true
; close further than this beyond the level = "Missed move - do not chase"
max_extension_atr = 0.80
; entry_mode = close (enter on the confirmed close), retest (wait for a pull-back to the level) or
; early (enter BEFORE the break on a micro-structure trigger, at early_risk_mult of the normal risk - see [TRADE_PLAN])
entry_mode = close
retest_tolerance_atr = 0.25
retest_max_bars = 6
; a close back inside the level by this much invalidates the breakout
invalidate_atr = 0.25
cooldown_bars = 6
intrabar_alerts = false

[TRADE_PLAN]
; underlying stop = level - sl_atr x ATR (CE), capped at max_sl_atr x ATR from entry
sl_atr = 0.50
max_sl_atr = 1.20
t1_r = 1.5
t2_r = 3.0
min_rr = 1.2
max_premium_loss_pct = 35
; assumed holding time for the theta cost estimate, and the paper time stop
expected_hold_minutes = 45
max_hold_minutes = 120
; Exit an open paper trade as soon as its breakout fails (a 5-min close back inside the level by invalidate_atr),
; instead of waiting for the underlying stop. Tested 20 Oct on NIFTY 2023-26: PF 0.99 -> 0.97 in the first 70%,
; 1.12 -> 1.19 in the last 30%. It did not help in both halves, so it is OFF.
exit_on_failed_breakout = false
; After T1, trail the premium stop this % below the best bid seen (0 = move to breakeven only, as before).
; Tested 10 / 20 / 30: 10 hurt; 20 and 30 changed the result by less than the noise. OFF.
trail_after_t1_pct = 0
; Stop model for the underlying: level (broken level - sl_atr x ATR, as before), swing (beyond the last confirmed
; swing) or atr (entry - atr_stop_mult x ATR). Every stop is capped at max_sl_atr.
stop_model = level
atr_stop_mult = 1.0
; Exit profile: classic (half at T1 then breakeven, rest at T2 - as before) or ladder (book ladder_book_pct % of the
; ORIGINAL quantity at each ladder_r multiple of the risk; breakeven after the first step; the rest trails).
exit_profile = classic
ladder_r = 1.0, 1.5, 2.0, 3.0
ladder_book_pct = 25, 25, 0, 0
; After the first scale-out: trail the underlying (none | atr = best close - trail_atr_mult x ATR | swing = last
; confirmed swing), and optionally exit on a close back across VWAP or on momentum exhaustion.
trail_mode = none
trail_atr_mult = 1.0
vwap_exit = false
momentum_exit = false
; Early entries (entry_mode = early): score >= early_min_score, within early_max_distance_atr of the level, a close
; beyond the previous bar's high (CE) / low (PE); risk budget x early_risk_mult.
early_risk_mult = 0.5
early_min_score = 75
early_max_distance_atr = 0.35

[OPTIONS]
; strikes examined: ATM +/- this many strikes
strikes_each_side = 3
delta_min = 0.35
delta_max = 0.70
delta_target = 0.55
min_premium = 20
min_volume = 1000
min_oi = 5000
; 0DTE: on an index's own expiry day use the next expiry unless allow_0dte = true
allow_0dte = false
; switch to the next expiry when fewer than this many trading hours remain
min_hours_to_expiry = 4
; paper fills: buy at ask + slippage, sell at bid - slippage (or LTP -/+ half the assumed spread)
slippage_pct = 0.25
assumed_spread_pct = 1.0

[RISK]
capital = 500000
risk_per_trade_pct = 1.0
; realised + open paper P&L (net of charges) at which new entries stop for the day (0 = off)
max_daily_loss_rupees = 60000
max_open_positions = 3
max_trades_per_index = 3
max_trades_per_session = 8
max_premium_pct_of_capital = 20
; gap risk: if the open gaps more than this x daily ATR, no entries before the opening range completes + 15 min
gap_atr = 0.6
; expiry day of the index itself: no new entries after this time
expiry_day_cutoff = 13:30
max_vix = 30
; Stop new entries for the rest of the day after this many losing trades in a row (0 = off).
; Off while paper trading so every trade is taken; a sensible live value is 3.
max_consecutive_losses = 0
; Most open positions on the same side (CE or PE) across both indices (0 = off). NIFTY and SENSEX calls
; open together are close to one bet. Off while paper trading; a sensible live value is 2.
max_same_direction = 0
; Portfolio limits (0 = off). The daily loss limit is the tighter of max_daily_loss_rupees and max_daily_loss_pct.
max_daily_loss_pct = 0
; realised + open P&L since Monday, % of capital: no new entries for the rest of the week once reached
max_weekly_loss_pct = 0
; total premium of open positions, % of capital
max_open_premium_pct = 0
; open lots on one expiry date across both indices
max_lots_per_expiry = 0
; NIFTY and SENSEX move together: same-side open risk across both <= this x one trade's risk budget (e.g. 1.5)
correlated_risk_mult = 0

[STRATEGY_V3]
; Multi-factor v3 layer (src/scanner/score_v3.py): 7 strategy modules, market regime, trap engine.
; Research starting values, not fitted ones; check them with python -m src.backtest.v3_report.
kc_mult = 1.5
; opening ranges watched by the opening-range module (minutes) and the initial balance
or_windows = 5, 15, 30
ib_minutes = 60
; swing highs / lows within this many ATR of each other form an equal-high / equal-low liquidity pool
eq_tol_atr = 0.10
htf_minutes = 15, 30
sweep_lookback = 3
; family weights (must sum to 100), multiplied by the regime profile when regime_adapt = true
w3_structure = 20
w3_compression = 15
w3_momentum = 15
w3_vwap = 15
w3_participation = 10
w3_derivatives = 15
w3_mtf = 10
regime_adapt = true
; no new v3 entries in an "Uncertain / no trade" regime
block_uncertain_regime = true
; liquidity-sweep reversals are only taken in range / sideways / compression / high-volatility-reversal regimes
allow_reversal_in_trend = false
; report = list traps only; penalize = subtract their points and refuse the entry at trap_block_points; block = any trap refuses
trap_action = penalize
trap_block_points = 25
; ATM IV rising more than this % in ~30 minutes is an "IV spike" trap
iv_spike_pct = 10

[SCORE_V3]
; v3 runs alongside v1 with its own stage tracker and paper book (like v2), for comparison.
enabled = true
; send its alerts to Telegram / popups too (false = dashboard and database only)
push = false
; Any strategy setting can be overridden for the v3 lane only. v3 scores sit on a different scale from v1, so its
; thresholds are calibrated: python -m src.backtest.v3_report fits them on the first 70% of the history (same
; exceedance rate near a level as v1's thresholds). Values below: NIFTY 2023-01 .. 2025-07 (25 Oct 2026 run).
early_watch = 27
high_watch = 47
strong_watch = 65
confirm_min_score = 35
entry_min_score = 47
watch_min_dominance = 20
entry_min_dominance = 25
early_min_score = 59
exit_profile = classic
trail_mode = none

[EXECUTION]
; Order execution engine (src/execution/order_manager.py) - mirrors one lane's paper trades to a broker.
;   off    paper book only (no order path)
;   paper  simulated orders through the full order path (validation, journal, partial fills, reconciliation)
;   live   real Upstox orders, ONLY after `python -m src.execution.live_gate --arm` today AND
;          LIVE_TRADING_CONFIRM=I ACCEPT REAL-MONEY RISK in .env. Until then it runs exactly like paper.
mode = paper
; which lane's trades are mirrored: v1 (main), v2 or v3
lane = v1
; at most this many lots per live position (the paper position may be larger)
max_live_lots = 1
max_orders_per_day = 20
; entry: LIMIT at ask + entry_buffer_pct %, never above the planned premium + max_entry_slip_pct %; cancelled
; (never chased) if not filled within order_timeout_seconds
entry_buffer_pct = 0.5
max_entry_slip_pct = 2.0
order_timeout_seconds = 20
; exit: LIMIT at bid - exit_buffer_pct %, re-priced up to max_reprice times, then MARKET (exchange protection)
exit_buffer_pct = 1.0
max_reprice = 2
exit_market_after_retries = true
; a SELL stop-loss order rests at the broker after every fill (moved with the paper stop)
protective_sl = true
sl_limit_gap_pct = 5.0
reconcile_seconds = 60
max_quote_age_seconds = 30
min_margin_buffer_pct = 10
; Upstox product: I = intraday
product = I
tag_prefix = pb
; only if your Upstox app has an exchange-approved algo name (sent as X-Algo-Name)
algo_name =

[NOTIFY]
telegram = true
desktop_popup = true
popup_seconds = 30
sound = true
; which alert types to push (all are always logged, stored and shown on the dashboard)
notify_early_watch = false
notify_high_watch = true
notify_strong_watch = true
notify_confirmed = true
notify_missed = true
notify_entry = true
notify_invalidated = true
notify_exit = true
notify_data = true
min_seconds_between_messages = 1.5

[COSTS]
; Charges per executed option order (paper P&L is always net of these)
; Flat brokerage per executed order (rupees)
brokerage_per_order = 20
; STT on the sell side of option premium, %
stt_sell_pct = 0.15
; Exchange transaction charge on premium, % (NSE F&O for NIFTY / BSE F&O for SENSEX)
nse_txn_pct = 0.03503
bse_txn_pct = 0.0325
; SEBI turnover fee, rupees per crore
sebi_per_crore = 10
; Stamp duty on the buy side, %
stamp_buy_pct = 0.003
; GST on brokerage + exchange + SEBI fee, %
gst_pct = 18

[MOVEMENT]
; 5 / 10 / 15-minute movement trigger service: python -m src.movement (Flask page http://127.0.0.1:8503).
; Runs beside the scanner and does not need it. Alerts only. Values here are the defaults; changes saved on the
; web page go to data/movement_rules.json and win until "Reset to ini". Thresholds are starting hypotheses.
host = 127.0.0.1
port = 8503
; seconds between evaluations (Upstox REST; the 1-min candles are refreshed every ~25 s, the last price every poll)
poll_seconds = 10
windows = 5, 10, 15
; trigger: |move| over the window >= this % of the price ...
move_pct = 5:0.15, 10:0.25, 15:0.35
; ... OR >= this many points (per index, 0 = off)
move_points_NIFTY = 5:0, 10:0, 15:0
move_points_SENSEX = 5:0, 10:0, 15:0
; confirmation checks (0 / false = off). Every switched-on check passing makes a trigger CONFIRMED.
; strength = move / (1-min ATR x sqrt(window)); about 1 is an ordinary move for that window
min_strength = 1.5
; futures volume per minute in the window vs the 30 minutes before it
min_rvol = 1.2
; share of the window's 1-min candles closing in the move's direction
min_consistency = 0.6
; futures OI must be building with the move (long build-up for UP, short build-up for DOWN)
oi_confirm = false
; CONFIRMED and move >= strong_mult x threshold -> STRONG
strong_mult = 1.5
; one extra "ALL" trigger when every window moves the same way, each >= alignment_frac x its threshold
alignment = true
alignment_frac = 0.6
; India VIX change (%) per window that triggers (0 = off)
vix_move_pct = 5:3, 10:4, 15:5
; minutes before the same index / window / direction can trigger again (0 = the window length)
cooldown_minutes = 0
max_data_age_seconds = 120
; send Telegram / popup / webhook (MOVEMENT_WEBHOOK_URL in .env) from this quality: UNCONFIRMED, CONFIRMED, STRONG
push = true
push_min_quality = CONFIRMED
telegram = true
desktop_popup = false
; Windows popup (with sound) for every paper-trade entry and exit, separate from the movement popups above
trade_popup = true

[PAPER_MOMENTUM]
; Paper trading on the [MOVEMENT] triggers: UP buys a CE, DOWN buys a PE. SIMULATED - no orders are placed.
; Contract from the live option chain with the [OPTIONS] filters; entry at ask + slippage, exit at bid - slippage,
; net of [COSTS]. Untested starting values: judge them on paper results before trusting them.
enabled = true
; CE, PE or both
sides = CE, PE
; which triggers open a trade: window minutes and/or ALL
entry_windows = 5, 10, 15, ALL
min_quality = CONFIRMED
lots = 1
; premium stop / target, % of the entry premium
stop_pct = 20
target_pct = 40
; stop moves to entry once the premium is this % up, then trails trail_pct % below the best bid (0 = off)
breakeven_pct = 15
trail_pct = 10
; exit if the index gives back this share of the trigger move (0 = off)
fade_exit = 0
max_hold_minutes = 30
; per day: trade cap, and the loss (realised + open, rupees) that closes the book for the day (0 = off)
max_trades = 10
max_daily_loss = 10000
; minutes before the same index trades again in this book, plus loss_wait_minutes after a losing trade
reentry_minutes = 5
loss_wait_minutes = 10
; close on a trigger in the opposite direction
exit_on_reverse = true
last_entry = 14:45
square_off = 15:15

[PAPER_SCALP]
; Scalping book: its own fast triggers (trigger_* below override [MOVEMENT] for this book only), a small target,
; a tight stop and a short hold. Same simulation rules as above. Untested starting values.
enabled = true
sides = CE, PE
entry_windows = 1, 3, ALL
min_quality = CONFIRMED
lots = 1
stop_pct = 8
target_pct = 12
breakeven_pct = 5
trail_pct = 4
; exit when the index gives back half of the move that triggered the trade
fade_exit = 0.5
max_hold_minutes = 8
max_trades = 20
max_daily_loss = 6000
reentry_minutes = 2
loss_wait_minutes = 5
exit_on_reverse = true
last_entry = 15:00
square_off = 15:15
trigger_windows = 1, 3
trigger_move_pct = 1:0.06, 3:0.10
trigger_min_strength = 1.8
trigger_min_rvol = 1.3
trigger_min_consistency = 0.66
trigger_alignment = true
trigger_alignment_frac = 0.8

[STRATEGIES]
; Strategy library (src/movement/strategies.py), run inside python -m src.movement. Each strategy is its own
; PAPER book: UP signal buys a CE, DOWN buys a PE, simulated only, same contract choice / fills / charges as
; [PAPER_MOMENTUM]. Signals are evaluated on COMPLETED bars of `timeframe` minutes. Every value is an untested
; starting point: judge each strategy on its own paper results (and a backtest) before trusting it.
; timeframe = the default bar size for every strategy: 1, 3, 5, 10, 15, 30 or 60 minutes. Any strategy can use its
; own: `timeframe = 15` in its [STRATEGY_<KEY>] section. Backtest: python -m src.movement.backtest --strategies all
; enabled = all, none, or a list of keys (python -m src.movement.strategies --list shows all 54 with their rules)
enabled = all
timeframe = 5
; exit / risk settings shared by every strategy book (override any of them in its [STRATEGY_<KEY>] section)
sides = CE, PE
lots = 1
stop_pct = 20
target_pct = 35
breakeven_pct = 15
trail_pct = 10
max_hold_minutes = 45
max_trades = 4
max_daily_loss = 5000
reentry_minutes = 10
loss_wait_minutes = 15
exit_on_reverse = true
last_entry = 14:45
square_off = 15:15

[STRATEGY_BREAKOUT_MOMENTUM]
; Breakout Momentum: close beyond the `lookback`-bar high/low, body >= min_body of the range, futures RVOL >= min_rvol (or range >= min_range_atr x ATR without volume), RSI >= rsi_up (<= 100 - rsi_up for PE)
enabled = true
lookback = 20
min_body = 0.55
min_rvol = 1.5
min_range_atr = 1.3
rsi_up = 55

[STRATEGY_EMA_PULLBACK]
; EMA Pullback: EMA20 > EMA50 trend, previous bar touched EMA20 (within touch_atr x ATR), close above the previous high
enabled = true
touch_atr = 0.15

[STRATEGY_VWAP_REVERSAL]
; VWAP Reversal: futures previous bar >= stretch_atr ATR from VWAP with RSI <= rsi_low (>= 100 - rsi_low), reversal bar. Needs futures volume
enabled = true
stretch_atr = 1.5
rsi_low = 35

[STRATEGY_ORB]
; Opening Range Breakout: first close beyond the first range_minutes high/low + buffer_atr x ATR, before cutoff
enabled = true
range_minutes = 15
buffer_atr = 0.1
cutoff = 11:30

[STRATEGY_RSI_MACD_DIVERGENCE]
; RSI + MACD Divergence: two pivot lows/highs (pivot bars each side) in the last lookback bars, newest within max_age bars, RSI differs by rsi_gap, MACD histogram turning
enabled = true
lookback = 40
pivot = 3
max_age = 8
rsi_gap = 2.0

[STRATEGY_ADX_TREND]
; ADX Trend Following: +DI/-DI cross (or ADX crossing adx_min with DI aligned), ADX >= adx_min and rising, price beyond EMA50
enabled = true
adx_min = 25.0

[STRATEGY_BOLLINGER_REVERSION]
; Bollinger Band Mean Reversion: only when ADX <= adx_max: close back inside the 20,2 band after a close outside it
enabled = true
adx_max = 20.0

[STRATEGY_VOLUME_PROFILE]
; Volume Profile + S/R: futures volume profile of the previous + current session (bins price buckets): rejection of VAL/PDL or VAH/PDH within touch_atr x ATR, or 2 closes beyond the value area. Needs futures volume
enabled = true
bins = 60
touch_atr = 0.2

[STRATEGY_OI_BUILDUP]
; OI Buildup: futures price change >= min_price_pct and OI change >= min_oi_pct over `bars` bars (long build-up / short build-up), newly true
enabled = true
bars = 3
min_price_pct = 0.15
min_oi_pct = 0.5

[STRATEGY_PCR]
; PCR Strategy: option-chain PCR change >= min_change in `minutes`, PCR >= bull_level (<= bear_level) and price above (below) EMA20
enabled = true
minutes = 30.0
min_change = 0.1
bull_level = 1.0
bear_level = 0.9

[STRATEGY_SUPERTREND]
; Supertrend: Supertrend(length, mult) flip
enabled = true
length = 10
mult = 3.0

[STRATEGY_FIRST_HOUR]
; First-Hour Momentum: after 10:15: first hour moved >= min_move_pct, first close beyond its high/low, before cutoff
enabled = true
min_move_pct = 0.4
cutoff = 13:00

[STRATEGY_ATR_BREAKOUT]
; ATR Volatility Breakout: first close beyond today's open +/- k x daily ATR(14)
enabled = true
k = 0.5

[STRATEGY_MTF_CONFIRMATION]
; Multi-Timeframe Confirmation: 15-min EMA20/50 + Supertrend trend, 5-min close crossing EMA9 or MACD crossing its signal, 1-min close above EMA20 and rising
enabled = true

[STRATEGY_PREMIUM_MOMENTUM]
; Options Premium Momentum: ATM CE premium up >= min_rise_pct and PE down >= min_fall_pct (or the mirror) over `minutes`, same strike
enabled = true
minutes = 10.0
min_rise_pct = 8.0
min_fall_pct = 5.0

[STRATEGY_MA_CROSSOVER]
; Moving Average Crossover (Trend following). CE: SMA fast crosses above SMA slow. PE: SMA fast crosses below SMA slow. Data: spot index bars
enabled = true
fast = 20
slow = 50

[STRATEGY_EMA_9_21]
; EMA 9/21 (Trend following). CE: EMA9 crosses above EMA21, close above EMA9. PE: EMA9 crosses below EMA21, close below EMA9. Data: spot index bars
enabled = true
fast = 9
slow = 21

[STRATEGY_EMA_20_50_200]
; EMA 20/50/200 (Trend following). CE: EMA20 > EMA50 > EMA200 and close > EMA20 becomes true. PE: EMA20 < EMA50 < EMA200 and close < EMA20 becomes true. Data: spot index bars (205+ bars of the timeframe)
enabled = true

[STRATEGY_DONCHIAN]
; Donchian Channel Breakout (Trend following). CE: first close above the previous N-bar high. PE: first close below the previous N-bar low. Data: spot index bars
enabled = true
length = 20

[STRATEGY_ICHIMOKU]
; Ichimoku Cloud (Trend following). CE: Tenkan crosses above Kijun, close above the cloud. PE: Tenkan crosses below Kijun, close below the cloud. Data: spot index bars
enabled = true
