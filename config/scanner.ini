[CONSOLE]
; Trading console (python -m src.console): web UI over live / paper / backtest results, risk, broker and health.
; It never places orders. Keep host = 127.0.0.1 unless it sits behind HTTPS (then secure_cookies = true).
host = 127.0.0.1
port = 8510
session_minutes = 30
secure_cookies = false
max_login_failures = 5
lockout_minutes = 15
broker_cache_seconds = 15
require_2fa_for_admin = false
; AI assistant (Claude API). Needs ANTHROPIC_API_KEY (Credentials page, .env or environment). Questions and
; read-only lookup results are sent to Anthropic; credentials never are.
ai_enabled = true
ai_model = claude-sonnet-5-5
ai_max_tokens = 1500
ai_requests_per_hour = 30

[STOCK_OPTIONS]
; NIFTY 50 stock options service (python -m src.stocks, http://127.0.0.1:8504). Paper only.
; |score| needed for a CE / PE plan (max about 8); below watch_score a stock is NO_TRADE
min_score = 4.5
watch_score = 3.0
; targets in R (R = entry - stop on the underlying); min_rr must hold on spot AND on the premium net of charges
rr_t1 = 1.5
rr_t2 = 2.5
min_rr = 1.2
; stop distance on the underlying, in 15-minute ATRs
min_stop_atr = 0.6
max_stop_atr = 1.8
; premium stop never further than this % below the entry premium
max_premium_loss_pct = 35
; strike choice: delta closest to target_delta within min..max, bid-ask spread at most max_spread_pct %
target_delta = 0.55
min_delta = 0.35
max_delta = 0.75
max_spread_pct = 5
; skip an expiry with fewer days left than this (roll to the next month)
min_days_to_expiry = 3
entry_start = 09:30
entry_end = 14:30
square_off = 15:15
; theta charged against the targets for this expected holding time
hold_hours = 1.5
refresh_seconds = 180
requests_per_second = 5

[STOCK_PRECISION]
; Precision mode for the NIFTY 50 stock CE / PE plans (python -m src.stocks). A VALID plan must ALSO pass these
; checks to become a TOP PICK; only top picks open paper trades, best rank first. enabled = false = old behaviour
; (every VALID plan is paper-traded). Starting values from 3 paper days - not a proven edge.
enabled = true
; paper trades per day / open at the same time
max_picks_per_day = 8
max_open = 5
; no new pick after this time (late entries have little time to reach T1)
last_entry = 14:30
; NIFTY votes: day change, EMA 9/21 (15m), Supertrend (15m); a CE needs nifty_min_votes of them up, a PE down
require_nifty_align = true
nifty_min_votes = 2
; stock must beat the NIFTY today by at least min_rs_pct % (PE: lag it)
require_relative_strength = true
min_rs_pct = 0.0
; on the trade's side of VWAP and no further than max_vwap_atr x ATR(15m) from it; RSI(14) not beyond these
max_vwap_atr = 1.5
rsi_ce_max = 70
rsi_pe_min = 30
; last completed 15m bar closed in the trade's direction, in the outer half of its range
require_confirm_bar = true
; option premium at least min_premium rupees, bid-ask spread at most max_spread_pct % of the premium
min_premium = 8
max_spread_pct = 2
; premium reward:risk to T1 after charges
min_rr = 1.5

[STOCK_BREAKOUT]
; Pre-breakout suggestions for the NIFTY 50 stocks (same service: python -m src.stocks, section "Before the breakout").
; READY = coiled next to a level -> set the trigger; a paper trade opens only on a CONFIRMED 15m close after READY.
; Paper only. All values are starting points - check them with: python -m src.stocks.breakout_backtest
enabled = true
; --- levels / compression (15-minute bars)
; base = the last box_bars bars; counts as a base when no taller than max_box_atr x ATR(15m)
box_bars = 6
max_box_atr = 2.0
; levels closer than merge_atr x ATR form one zone; a bar within touch_atr counts as a test of the level
merge_atr = 0.25
touch_atr = 0.15
; TTM squeeze: Bollinger(bb_length, bb_std) inside Keltner(bb_length, kc_mult x ATR)
bb_length = 20
bb_std = 2.0
kc_mult = 1.5
; volume dry-up: base volume <= dryup_ratio x the 20 bars before it
dryup_ratio = 0.8
; --- stages (score 0-100)
watch_atr = 1.0
ready_atr = 0.35
watch_score = 55
ready_score = 70
; READY also needs this many of the 20 compression points
min_compression = 8
; trigger = level + max(buffer_atr x ATR, buffer_pct % of price)
buffer_atr = 0.10
buffer_pct = 0.05
; a close more than chase_atr beyond the level = MISSED (do not chase); back inside by fail_atr = FAILED
chase_atr = 0.8
fail_atr = 0.25
; CONFIRMED bar: volume >= confirm_volume x 20-bar average, body >= confirm_body_pct % of the range,
; close in the outer part of the bar (>= confirm_close_pct % of the range from the far end)
confirm_volume = 1.5
confirm_body_pct = 50
confirm_close_pct = 60
; trade a breakout only when the same level was READY first; longs only above VWAP, shorts only below
require_prior_ready = true
require_vwap_side = true
; --- context
; relative strength vs NIFTY: full points at rs_full_pct %; relative volume full at rvol_full x (same time of day,
; average of rvol_days sessions)
rs_full_pct = 0.75
rvol_full = 1.5
rvol_days = 10
; skip stocks whose 15m ATR is below this % of price (moves too small to beat charges)
min_atr_pct = 0.15
; gap bigger than gap_pct %: no entries before gap_wait
gap_pct = 2.0
gap_wait = 09:45
; penalties: RSI(14) beyond rsi_extreme (or below 100 - rsi_extreme), price beyond vwap_stretch_atr from VWAP
rsi_extreme = 75
vwap_stretch_atr = 2.5
; --- trade plan (underlying)
min_stop_atr = 0.6
max_stop_atr = 1.2
rr_t1 = 1.5
rr_t2 = 2.5
min_rr = 1.2
; --- intraday equity sizing: risk_pct % of capital per trade, notional capped at capital x leverage (MIS)
capital = 500000
risk_pct = 0.5
leverage = 5
; --- session
entry_start = 09:30
entry_end = 14:30
square_off = 15:15
max_trades = 6
; close = enter on a CONFIRMED 15m close (fewer false breakouts); touch = enter when the trigger trades after READY
entry_mode = close
; Telegram for READY / CONFIRMED / paper entries (TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID in .env)
notify = false

[COSTS_EQUITY]
; NSE intraday equity charges for the breakout planner (check with your broker)
brokerage_pct = 0.1
brokerage_cap = 20
stt_sell_pct = 0.025
nse_txn_pct = 0.00297
sebi_per_crore = 10
stamp_buy_pct = 0.003
gst_pct = 18
