; =============================================================================
; F&O multi-strategy engine  (python -m src.fno)
; Every value here is a starting point for testing. None of them is known to be profitable.
; Only the settings you want to change need to be listed; the rest use the defaults in src/fno/config.py.
; Contract details (expiries, lot sizes, strikes) are NOT set here: they come from the Upstox master daily.
; =============================================================================

[SERVICE]
; This engine is paper-only. Any other value is refused at start-up.
mode = paper
port = 8520
cycle_seconds = 30
; Paper capital used for position sizing and the percentage risk limits (rupees)
capital = 500000
websocket = true

[UNIVERSE]
indices = NIFTY, BANKNIFTY, MIDCPNIFTY, SENSEX
; all = every NSE stock that has options today | none | a comma-separated list (RELIANCE, HDFCBANK, ...)
stocks = all
; Upstox allows about 2000 requests per 30 minutes: stocks are analysed in rotation, biggest movers first
max_stock_scans_per_cycle = 25
stock_refresh_seconds = 300
benchmark = NIFTY

[TIMEFRAMES]
; Signals are evaluated on completed bars of base_tf minutes (1, 3, 5, 15, 30 or 60)
base_tf = 5
; Lower timeframe for entry confirmation (1 or 3); higher timeframes for trend direction (daily is added)
ltf = 1
htfs = 15, 30, 60
htf_min_agree = 2

[CONFLUENCE]
; Checks: STRUCTURE, MOMENTUM, LOCATION (VWAP / EMA), VOLUME, HTF, CANDLE, LTF
min_confirmations = 4
reversal_min_confirmations = 3
required = LOCATION, CANDLE
reversal_required = CANDLE
confirm_bars = 2
min_rvol = 1.2
min_confidence = 55
; confidence shown on a signal: agreement = strategy agreement score (share of the indicator groups behind the
; strategies that point the same way as the signal, 0-100) | confluence = the seven checks above plus agreeing strategies
confidence_mode = agreement
; The chosen option's own premium must be rising before a paper entry
require_premium_confirmation = true
premium_lookback_minutes = 5

[PLAN]
; Stop-loss and targets are set on the option premium. R = entry premium - stop premium.
; percent = fixed % of the live premium: stop sl_pct below the entry, T1 / T2 target_pct above it, all out at T2.
; r = stop from the level of the underlying (ATR / swing) and three targets in multiples of R (the settings below).
plan_mode = percent
sl_pct = 10
target_pct = 15, 25
sl_atr_mult = 1.2
min_premium_sl_pct = 8
max_premium_sl_pct = 30
target_r = 1, 2, 3
; Share of the lots booked at T1 / T2 / T3
book_pct = 40, 30, 30
breakeven_after_t1 = true
; atr | swing | off
trail_mode = atr
trail_after = 1
trail_atr_mult = 2
max_hold_minutes = 120
first_entry = 09:20
last_entry = 14:45
square_off = 15:15
; minimum reward : risk at T2 after charges and slippage (1 : 2)
min_rr_after_costs = 2

[CONTRACT]
; delta = strike closest to target_delta inside the delta band | moneyness = ATM / ITM / OTM +- strike_distance
selection = delta
moneyness = ATM
strike_distance = 0
target_delta = 0.5
delta_min = 0.4
delta_max = 0.65
min_premium = 5
max_spread_pct = 3
; Open interest and today's volume, in lots
min_oi = 500
min_volume = 100
; IV percentile (indices): where today's ATM IV sits in the last iv_pctile_days days of recorded chains, 0-100.
; max_iv_pctile = 0 switches the filter off; e.g. 85 = no option BUY when IV is in the top 15% of that range.
max_iv_pctile = 80
iv_pctile_days = 30
; nearest | next | monthly
expiry = nearest
stock_min_days_to_expiry = 3

[RISK]
risk_per_trade_pct = 1
max_daily_loss_pct = 3
daily_profit_lock_pct = 4
max_trades_per_day = 6
max_open_positions = 3
max_consecutive_losses = 3
signal_cooldown_minutes = 20
no_trade_windows = 09:15-09:20, 15:15-15:30
; Entries are blocked this many minutes around each event in config/events.csv
event_block_minutes = 30
expiry_day_last_entry = 13:30
expiry_day_risk_mult = 0.5
allow_expiry_day_contract = false
slippage_pct = 0.25
auto_kill_on_daily_loss = true

[BACKTEST]
; History has no bid / ask: the spread is an assumption (% of the premium, full spread)
bt_assumed_spread_pct = 1
bt_slippage_pct = 0.25
bt_oos_fraction = 0.3
bt_wf_train_days = 40
bt_wf_test_days = 10
bt_min_trades = 20

; Charges: taken from [COSTS] of config/scanner.ini unless a [COSTS] section is added here.
; Check stt_sell_pct and the exchange rates against a recent contract note from your broker.

; Per-strategy settings: [STRATEGY_<key>] with enabled = true/false and any parameter shown by
;   python -m src.fno strategies
; Example:
; [STRATEGY_ORB]
; enabled = true
; minutes = 30
