[STRATEGY_MACD_ADX]
; MACD + ADX Confirmation (Combination). CE: MACD cross up with ADX >= adx_min and +DI > -DI. PE: MACD cross down with ADX >= adx_min and -DI > +DI. Data: spot index bars
