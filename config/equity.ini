; NIFTY 50 cash-equity trading: intraday module + swing module (python -m src.equity, shown on the desk at :8500).
; Secrets never go here: tokens and keys stay in .env. Restart the service after editing (risk values can also be
; changed from the dashboard; those overrides are stored in data/equity/equity.db and win over this file).

[SERVICE]
host = 127.0.0.1
port = 8530
; seconds between quote polls (one batched call for all 50 stocks) and between intraday candle scans (50 calls)
quote_seconds = 10
scan_seconds = 120
requests_per_second = 4
; Upstox allows 500 requests / minute and 2000 / 30 minutes per user, shared with the other services
max_requests_per_minute = 300
max_requests_per_30min = 1500
; live LTP stream over the Upstox market-data WebSocket. Off by default: Upstox limits the number of
; connections per user and the index scanner already holds one.
websocket = false

[EXECUTION]
; analysis = signals only | paper = simulated orders | live = real Upstox orders (needs arming, see README)
mode = paper
; live only: every order waits for a click on the dashboard before it is sent
live_confirm_each_order = true
; live only: send exits (target / square-off) without a click. The protective stop order is always placed.
live_auto_exits = false
; LIVE orders are only ever proposed for strategies that passed in-sample + out-of-sample + walk-forward validation
require_validation = true
; PAPER mode may forward-test strategies that are not validated yet (they are labelled "unvalidated" everywhere)
paper_unvalidated = true

[RISK]
capital = 500000
risk_per_trade_pct = 0.5
max_daily_loss_pct = 2.0
max_open_intraday = 5
max_open_swing = 5
; planned reward:risk to target 2 must be at least 1:min_rr, and at least 1:min_net_rr after charges and slippage
min_rr = 2.0
min_net_rr = 1.5
daily_trade_limit = 40
max_consecutive_losses = 3
; cash market, no leverage: one position may use at most this share of capital
max_position_pct = 20
; assumed slippage per side, in basis points of price
slippage_bps = 3
; swing sizing adds this many daily ATRs to the stop distance (overnight gap allowance)
gap_risk_atr = 0.5
; swing: no new entry when the stock opens more than this many ATRs away from the signal close
max_entry_gap_atr = 0.75

[INTRADAY]
enabled = true
allow_short = true
entry_start = 09:30
entry_end = 14:45
square_off = 15:10
orb_minutes = 30
; stop distance is kept between these multiples of the 5-minute ATR, and at least min_stop_pct of price
; charges are roughly Rs 70-90 a round trip, so a very tight stop makes them a large share of the risk
stop_atr_min = 1.0
stop_atr_max = 3.0
min_stop_pct = 0.4
target1_r = 1.5
target2_r = 2.5
min_strength = 55
; a signal can be entered for this many minutes after its bar closed
signal_valid_minutes = 10
history_days = 20

[SWING]
enabled = true
min_hold_days = 2
max_hold_days = 5
; a 2-5 session trade needs a stop the price can leave behind within days: 0.8-1.5 daily ATRs
stop_atr_min = 0.8
stop_atr_max = 1.5
target1_r = 1.5
target2_r = 2.5
min_confidence = 55
history_days = 1100
; a pending swing entry is cancelled after this many sessions without a fill
entry_valid_sessions = 1

[STRATEGIES]
; "all", or a comma-separated list of strategy ids (see /api/strategies). Prefix with - to switch one off: all,-cup_handle
intraday = all
swing = all

[COSTS_DELIVERY]
; NSE delivery equity (check with your broker). Intraday charges come from [COSTS_EQUITY] in config/scanner.ini.
brokerage_pct = 0.1
brokerage_cap = 20
stt_pct = 0.1
nse_txn_pct = 0.00297
sebi_per_crore = 10
stamp_buy_pct = 0.015
gst_pct = 18
dp_charge_sell = 15.34

[BACKTEST]
intraday_years = 2
swing_years = 3
in_sample_pct = 70
walk_forward_folds = 4
; a strategy is "validated" only when its out-of-sample trades meet all of these
min_oos_trades = 20
min_oos_profit_factor = 1.1
min_wf_positive_folds = 0.5

[ALERTS]
dashboard = true
desktop_popup = true
sound = true
telegram = false
; POST each alert as JSON to EQUITY_WEBHOOK_URL (.env)
webhook = false
popup_seconds = 20
; which kinds are pushed to popup / telegram / webhook (all kinds are always stored and shown on the dashboard)
notify_buy_signal = true
notify_sell_signal = true
notify_entry = true
notify_stop = true
notify_target = true
notify_trend_reversal = false
notify_volume_breakout = false
notify_swing_exit = true
notify_risk_limit = true
notify_order = true
