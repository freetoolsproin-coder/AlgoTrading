[STRATEGY_VWAP_EMA]
; VWAP + EMA Confluence (Combination). CE: futures above VWAP and EMA9 > EMA21 (newly both). PE: futures below VWAP and EMA9 < EMA21 (newly both). Data: index futures bars with volume
